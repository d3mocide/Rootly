    <meta name="theme-color" content="#20503B" />

    <!-- PWA / web-app manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- iOS home-screen icon (iOS ignores the manifest for icons) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />

    <!-- iOS standalone-app mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rootly" />
    <!-- black-translucent: status bar overlays the app, content fills the full screen;
         safe-area CSS variables handle the offset in layout components. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
