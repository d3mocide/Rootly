services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
      - TIMEZONE=${TIMEZONE:-UTC}
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api:
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./api:/app
